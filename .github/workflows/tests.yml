name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # GUI.py は "X | Y" 型注記を使うため 3.10 以上が必要
          python-version: "3.10"

      # PyQt5 のホイールは Qt 本体を同梱するが、
      # 実行にはシステム側の共有ライブラリが必要
      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install Python dependencies
        run: pip install PyQt5 requests markdown pytest

      # ウィンドウは画面に出さずに動かす（conftest.py も設定するが明示しておく）
      # network マーカーの付いたテストは OpenRouter の稼働に依存するため除外する
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not network" -v
