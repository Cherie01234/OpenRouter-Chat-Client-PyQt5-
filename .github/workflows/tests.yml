name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # 本番環境は Windows。Linux だけだと環境差の不具合を取り逃す
    # （_is_busy() の競合は Linux でのみ顕在化した）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # GUI.py は "X | Y" 型注記を使うため 3.10 以上が必要
          python-version: "3.10"

      # PyQt5 のホイールは Qt 本体を同梱するが、
      # Linux では実行にシステム側の共有ライブラリが必要
      - name: Install system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install Python dependencies
        run: pip install PyQt5 requests markdown pytest

      # ウィンドウは画面に出さずに動かす（conftest.py も設定するが明示しておく）
      # network マーカーの付いたテストは OpenRouter の稼働に依存するため除外する
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not network" -v
